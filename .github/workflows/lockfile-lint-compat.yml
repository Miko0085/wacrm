name: Lockfile Lint Compatibility

on:
  push:
    branches: ['feature/wacrm-smart-lists']
    paths:
      - '.github/workflows/lockfile-lint-compat.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Keep lint toolchain on existing compatible version
        run: npm install --package-lock-only --save-exact --save-dev eslint-config-next@16.2.12
      - name: Commit manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: keep lint config compatible with existing codebase"
          git push origin HEAD:feature/wacrm-smart-lists
